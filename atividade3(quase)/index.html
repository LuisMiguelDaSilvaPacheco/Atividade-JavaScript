<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <button>BOTAOZÃOOOOO</button>
    <h1></h1>
    
    <script>
        let frases = ["Você consegue!", "Não desista!", "Plural de capivara é capivárias!", "*Frase muito motivacional*"]
        let cores = ["red", "green", "blue", "black"]
        let tamanhos = ["20px", "25px", "30px", "35px"]

        let texto = document.querySelector("h1")
        let botao = document.querySelector("button")

        botao.addEventListener('click', ()=>{
            texto.innerText = frases[Math.floor(Math.random() * 4)]
            texto.style.color = cores[Math.floor(Math.random() * 4)]
            texto.style.fontSize = tamanhos[Math.floor(Math.random() * 4)]
        })      
    </script>
